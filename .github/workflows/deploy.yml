name: Deploy (Tiya_master)

# Every push to Tiya_master:
#   1. runs the stories backend tests
#   2. deploys the stories backend to AWS (backend/deploy.sh)
#
# Supabase migrations are NOT applied here. Apply them by hand (see backend/README.md).
#
# Required repo secret:
#   AWS_DEPLOY_ROLE_ARN   IAM role assumed via GitHub OIDC (no long-lived AWS keys)

on:
  push:
    branches: [Tiya_master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Backend tests
        run: uv run --python 3.13 --with boto3 --with pytest pytest backend/tests -q

  deploy-stories:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy stories backend
        run: ./backend/deploy.sh
